        function handleIncomingData(event, source) {
            const view = event.target.value;
            if (!view || view.byteLength < 8) return;
            const opcode = view.getUint16(0, false);
            if (opcode !== 0x000C) return;

            const channelPid = view.getUint8(2);
            const taskPid = view.getUint8(3);
            let offset = 8;  // 包头固定 8 字节
            const floats = [];

            // 根据 taskPid 判断数据格式
            // EMG (0x01) 和 EEG (0x02) 使用 uint16 格式
            // ECG (0x00) 使用 float32 格式
            const isInt16Format = (taskPid === 0x01 || taskPid === 0x02);

            if (isInt16Format) {
                // EMG/EEG: 读取 uint16，转换为 V
                while (offset + 2 <= view.byteLength) {
                    const uint16Value = view.getUint16(offset, true);  // 小端序
                    // 转换为 int16（处理符号位）
                    const int16Value = uint16Value > 0x7FFF ? uint16Value - 0x10000 : uint16Value;
                    // 转换为 V（硬件单位是 μV）
                    const voltValue = int16Value / 1000000;
                    floats.push(voltValue);
                    offset += 2;
                }
            } else {
                // ECG: 读取 float32
                while (offset + 4 <= view.byteLength) {
                    floats.push(view.getFloat32(offset, true));  // 小端序
                    offset += 4;
                }
            }

            if (!floats.length) return;

            // 简化调试 - 只在 EMG 模式下显示
            if (source === "ecg" && activeTask === "EMG") {
                console.log("🔍 [EMG数据包]", {
                    格式: isInt16Format ? "uint16" : "float32",
                    数据点数: floats.length,
                    前5个值_V: floats.slice(0, 5).map(v => v.toExponential(3)),
                    前5个值_mV: floats.slice(0, 5).map(v => (v * 1000).toFixed(3)),
                    数据范围_mV: [(Math.min(...floats) * 1000).toFixed(3), (Math.max(...floats) * 1000).toFixed(3)]
                });
            }

            const previewTask = getTaskConfig("PREVIEW");
            const electroTask = isMeasurementElectroKind(activeTask) ? getTaskConfig(activeTask) : null;

            if (source === "ecg" && appState === STATES.PREVIEW_RUNNING && matchesElectroPacket(channelPid, taskPid, previewTask)) {
                ingestPreviewFloats(floats);
                return;
            }

            if (source === "ecg" && isMeasurementElectroKind(activeTask)) {
                // 根据 taskPid 路由到正确的模式
                let targetMode = null;
                if (taskPid === 0x00 && (activeTask === "ECG" || activeTask === "CALCIUM" || activeTask === "EOG")) {
                    targetMode = activeTask;
                } else if (taskPid === 0x01 && activeTask === "EMG") {
                    targetMode = "EMG";
                } else if (taskPid === 0x02 && activeTask === "EEG") {
                    targetMode = "EEG";
                }

                if (targetMode && matchesElectroPacket(channelPid, taskPid, electroTask)) {
                    console.log("[handleIncomingData] 数据匹配成功:", targetMode);
                    ingestElectroFloats(floats, targetMode);
                } else {
                    console.warn("[handleIncomingData] 数据不匹配 - 期望:", activeTask, "taskPid:", "0x" + (electroTask ? electroTask.taskPid : 0).toString(16).padStart(2, '0'), "收到:", "0x" + taskPid.toString(16).padStart(2, '0'));
                }
            } else if (source === "ad5941" && activeAd5941Task === "GLU" && channelPid === TASKS.GLU.channelPid && taskPid === TASKS.GLU.taskPid) {
                ingestSingleChannelFloats(floats, "GLU");
            } else if (source === "ad5941" && (activeAd5941Task === "TEMP" || activeAd5941Task === "PULSE") && channelPid === TASKS.TEMP.channelPid && taskPid === TASKS.TEMP.taskPid) {
                ingestSingleChannelFloats(floats, activeAd5941Task);
            }
        }

        function ingestPreviewFloats(floats) {
            const rate = getTaskConfig("PREVIEW").samplingRate || getElectroSamplingRate();
            if (ecgStreamMode === "SINGLE") {
                if (!rawDataBuffer[0]) rawDataBuffer[0] = [];
                for (let i = 0; i < floats.length; i++) {
                    const t = previewSampleIndex / rate;
                    const value = scaledElectroValue(floats[i]);
                    if (Number.isFinite(value)) {
                        rawDataBuffer[0].push([t, value]);
                    }
                    previewSampleIndex++;
                }
                trimPreviewBuffer(rawDataBuffer[0], rate);
                return;
            }

            for (let i = 0; i < floats.length; i++) {
                const ch = previewInterleaveChannel;
                const t = previewSampleIndex / rate;
                if (!rawDataBuffer[ch]) rawDataBuffer[ch] = [];
                const value = scaledElectroValue(floats[i]);
                if (Number.isFinite(value)) {
                    rawDataBuffer[ch].push([t, value]);
                }
                previewInterleaveChannel = (previewInterleaveChannel + 1) % totalChannels;
                if (previewInterleaveChannel === 0) previewSampleIndex++;
            }
            rawDataBuffer.forEach(function(buffer) {
                trimPreviewBuffer(buffer, rate);
            });
        }

        function ingestElectroFloats(floats, mode) {
            const canRecord = recordingTimeSec() >= 0;

            // 详细调试 - EMG 模式
            if (mode === "EMG" && emgSampleIndex % 400 === 0) {
                console.log("📊 [EMG处理]", {
                    已处理样本数: emgSampleIndex,
                    本包数据点: floats.length,
                    数据范围: [Math.min(...floats).toFixed(6), Math.max(...floats).toFixed(6)],
                    流模式: ecgStreamMode,
                    通道数: totalChannels,
                    选中通道: selectedEcgChannel,
                    当前时间戳: (emgSampleIndex / 1000).toFixed(2) + "s",
                    canRecord: canRecord
                });
            }

            // 参考 app.js：所有数据点都记录（不做交错处理）
            for (let i = 0; i < floats.length; i++) {
                recordElectroValue(floats[i], canRecord, mode);
            }
        }

        function recordElectroValue(rawValue, canRecord, mode) {
            let value = scaledElectroValue(rawValue);
            if (!Number.isFinite(value)) {
                resetElectroProcessing();
                return;
            }

            if (electroFilter) value = electroFilter.process(value);
            if (!Number.isFinite(value)) {
                resetElectroProcessing();
                return;
            }

            if (baselineCorrector) value = baselineCorrector.process(value);
            if (!Number.isFinite(value)) {
                resetElectroProcessing();
                return;
            }

            if (!canRecord) return;

            const task = TASKS[mode];
            const rate = task ? task.samplingRate : getElectroSamplingRate(mode);

            // 简化调试 - 只在 EMG 模式下每 500 个样本打印一次
            if (mode === "EMG" && emgSampleIndex % 500 === 0 && emgSampleIndex > 0) {
                console.log("💾 [EMG存储]", {
                    样本索引: emgSampleIndex,
                    原始值_V: rawValue.toExponential(3),
                    转换后_mV: value.toFixed(3),
                    时间: (emgSampleIndex / rate).toFixed(2) + "s",
                    数组长度: emgData.length
                });
            }

            if (mode === "ECG") {
                const t = ecgSampleIndex / rate;
                if (!Number.isFinite(t)) return;
                ecgData.push([t, value]);
                sessionHasData = true;
                ecgSampleIndex++;
            } else if (mode === "CALCIUM") {
                const t = calciumSampleIndex / rate;
                if (!Number.isFinite(t)) return;
                calciumData.push([t, value]);
                sessionHasData = true;
                calciumSampleIndex++;
            } else if (mode === "EMG") {
                const t = emgSampleIndex / rate;
                if (!Number.isFinite(t)) return;
                emgData.push([t, value]);
                sessionHasData = true;
                emgSampleIndex++;
            } else if (mode === "EEG") {
                const t = eegSampleIndex / rate;
                if (!Number.isFinite(t)) return;
                eegData.push([t, value]);
                sessionHasData = true;
                eegSampleIndex++;
            } else if (mode === "EOG") {
                const t = eogSampleIndex / rate;
                if (!Number.isFinite(t)) return;
                eogData.push([t, value]);
                sessionHasData = true;
                eogSampleIndex++;
            }
        }

        function ingestSingleChannelFloats(floats, kind) {
            const task = TASKS[kind];
            if (recordingTimeSec() < 0) return;
            for (let i = 0; i < floats.length; i++) {
                if (kind === "GLU") {
                    const value = floats[i] * GLU_SCALE;
                    const t = glucoseSampleIndex / task.samplingRate;
                    glucoseData.push([t, value]);
                    sessionHasData = true;
                    glucoseSampleIndex++;
                } else if (kind === "TEMP") {
                    const value = floats[i] * RT_SCALE;
                    const t = tempSampleIndex / task.samplingRate;
                    tempRtData.push([t, value]);
                    sessionHasData = true;
                    tempSampleIndex++;
                } else if (kind === "PULSE") {
                    const value = floats[i] * RT_SCALE;
                    const t = pulseSampleIndex / task.samplingRate;
                    pulseRtData.push([t, value]);
                    sessionHasData = true;
                    pulseSampleIndex++;
                }
            }
        }

        function pickCalibrationFile() {
            document.getElementById("calFile").click();
        }

        function handleCalibrationFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const parsed = parseCalibrationText(e.target.result);
                if (parsed.glucose.length >= 2) glucoseCalibration = parsed.glucose;
                if (parsed.temp.length >= 2) temperatureCalibration = parsed.temp;
                if (parsed.calcium.length >= 2) calciumCalibration = parsed.calcium;
                calibrationFileName = file.name;
                updateMetrics();
                showNotice("Calibration loaded");
            };
            reader.readAsText(file);
            event.target.value = "";
        }

        function parseCalibrationText(text) {
            const result = { glucose: [], temp: [], calcium: [] };
            let columns = null;
            text.split(/\r?\n/).forEach(function(line) {
                const parts = splitLine(line);
                if (parts.length < 2) return;
                const detected = detectCalibrationColumns(parts);
                if (detected) {
                    columns = detected;
                    return;
                }
                if (columns) {
                    pushPair(result.glucose, parts, columns.glucose[0], columns.glucose[1]);
                    pushPair(result.temp, parts, columns.temp[0], columns.temp[1]);
                    pushPair(result.calcium, parts, columns.calcium[0], columns.calcium[1]);
                    return;
                }
                pushDefaultCalibrationPairs(result, parts);
            });
            result.glucose.sort((a, b) => a[0] - b[0]);
            result.temp.sort((a, b) => a[0] - b[0]);
            result.calcium.sort((a, b) => a[0] - b[0]);
            return result;
        }

        function splitLine(line) {
            const clean = String(line).replace(/^\uFEFF/, "").trim();
            if (!clean || clean[0] === "#") return [];
            if (line.indexOf("\t") >= 0) return line.split("\t").map(cleanCell);
            if (line.indexOf(",") >= 0 || line.indexOf(";") >= 0) return line.split(/[;,]/).map(cleanCell);
            return clean.split(/\s+/).map(cleanCell);
        }

        function cleanCell(value) {
            return String(value).trim().replace(/^"(.*)"$/, "$1").replace(/^\uFEFF/, "");
        }

        function pushPair(target, parts, inputIndex, outputIndex) {
            if (!Array.isArray(inputIndex)) {
                if (inputIndex < 0 || outputIndex < 0 || parts.length <= Math.max(inputIndex, outputIndex)) return;
                const x = parseFloat(parts[inputIndex]);
                const y = parseFloat(parts[outputIndex]);
                if (Number.isFinite(x) && Number.isFinite(y)) target.push([x, y]);
                return;
            }
        }

        function pushDefaultCalibrationPairs(result, parts) {
            if (parts.length >= 2) {
                const a = parseFloat(parts[0]);
                const b = parseFloat(parts[1]);
                if (Number.isFinite(a) && Number.isFinite(b)) {
                    const pair = defaultGlucoseCalibrationPair(a, b);
                    result.glucose.push(pair);
                }
            }
            if (parts.length >= 4) {
                const resistance = parseFloat(parts[2]);
                const temperature = parseFloat(parts[3]);
                if (Number.isFinite(resistance) && Number.isFinite(temperature)) {
                    result.temp.push([resistance, temperature]);
                }
            }
            if (parts.length >= 6) {
                const logCa = parseFloat(parts[4]);
                const potential = parseFloat(parts[5]);
                if (Number.isFinite(logCa) && Number.isFinite(potential)) {
                    result.calcium.push([potential, logCa]);
                }
            }
        }

        function defaultGlucoseCalibrationPair(first, second) {
            const firstLooksConcentration = Math.abs(first) <= 100 && Math.abs(second) > 100;
            const secondLooksConcentration = Math.abs(second) <= 100 && Math.abs(first) > 100;
            if (secondLooksConcentration && !firstLooksConcentration) return [first, second];
            return [second, first];
        }

        function detectCalibrationColumns(parts) {
            const names = parts.map(normalizeColumnName);
            const current = findColumn(names, ["current", "curr", "电流", "ua", "µa", "μa", "na"]);
            const glucose = findColumn(names, ["glucose", "glu", "葡萄糖", "血糖", "浓度", "concentration", "mmol"]);
            const resistance = findColumn(names, ["resistance", "res", "电阻", "ohm"]);
            const temperature = findColumn(names, ["temperature", "temp", "温度", "体温"]);
            const logCa = findColumn(names, ["logca", "lgca", "log10ca"]);
            const potential = findColumn(names, ["potential", "电位", "capotential", "voltage", "mv"]);

            const hasCore = current >= 0 && glucose >= 0 && resistance >= 0 && temperature >= 0;
            const hasCalcium = logCa >= 0 && potential >= 0;
            if (hasCore || hasCalcium) {
                return {
                    glucose: hasCore ? [current, glucose] : [-1, -1],
                    temp: hasCore ? [resistance, temperature] : [-1, -1],
                    calcium: hasCalcium ? [potential, logCa] : [-1, -1]
                };
            }
            if (current >= 0 && glucose >= 0) {
                return {
                    glucose: [current, glucose],
                    temp: [-1, -1],
                    calcium: [-1, -1]
                };
            }
            return null;
        }

        function normalizeColumnName(value) {
            return String(value).toLowerCase().replace(/[\s_()[\]{}\-\/\\]+/g, "");
        }

        function findColumn(names, keywords) {
            for (let i = 0; i < names.length; i++) {
                const name = names[i];
                if (!name) continue;
                for (let k = 0; k < keywords.length; k++) {
                    if (name.indexOf(keywords[k]) >= 0) return i;
                }
            }
            return -1;
        }

        function startMetricsLoop() {
            if (metricsInterval) return;
            metricsInterval = setInterval(updateMetrics, 1000);
            updateMetrics();
        }

        function updateMetrics() {
            // 只在 ECG 模式下显示心率；Calc/EMG/EEG 共用卡片但显示占位
            const hrValueEl = document.getElementById("hrValue");
            const hrLabelEl = hrValueEl ? hrValueEl.closest('.metric') : null;

            if (electroMode === "ECG") {
                const hr = calcHR(ecgData, charts.ECG ? charts.ECG.metricEnd() : lastTime(ecgData));
                hrValueEl.textContent = Number.isFinite(hr) ? String(hr) : "--";
                if (hrLabelEl) hrLabelEl.style.display = "";
            } else {
                hrValueEl.textContent = "--";
                if (hrLabelEl) hrLabelEl.style.display = "";
            }

            updateRfPredictionState();
            const gluEl = document.getElementById("gluValue");
            const gluUnitEl = document.getElementById("gluUnit");
            if (gluMode === GLU_MODES.RF) {
                if (rfState === "collecting") {
                    gluEl.textContent = Math.floor(rfElapsedSec()) + "/" + RF_CAPTURE_TARGET_SEC + "s";
                    gluUnitEl.textContent = "";
                } else if (rfState === "predicting") {
                    gluEl.textContent = "...";
                    gluUnitEl.textContent = "";
                } else if (Number.isFinite(rfPredictionValue)) {
                    gluEl.textContent = rfPredictionValue.toFixed(1);
                    gluUnitEl.textContent = "mmol/L";
                } else if (rfState === "no_model") {
                    gluEl.textContent = rfPredictionError || "No Model";
                    gluUnitEl.textContent = "";
                } else {
                    gluEl.textContent = "--";
                    gluUnitEl.textContent = "mmol/L";
                }
            } else {
                const glu = calcGlucose(charts.GLU ? charts.GLU.metricEnd() : lastTime(glucoseData));
                gluEl.textContent = Number.isFinite(glu) ? glu.toFixed(2) : "--";
                gluUnitEl.textContent = "mmol/L";
            }

            const temp = calcTemperature();
            document.getElementById("tempValue").textContent = Number.isFinite(temp) ? temp.toFixed(1) : "--";

            const caStats = electroMode === "CALCIUM" ? calcCalciumStats(charts.ECG ? charts.ECG.metricEnd() : lastTime(calciumData)) : { concentration: NaN };
            const caEl = document.getElementById("caValue");
            if (caEl) caEl.textContent = Number.isFinite(caStats.concentration) ? formatCalcium(caStats.concentration) : "--";
        }

        function updateRfPredictionState() {
            if (gluMode !== GLU_MODES.RF || rfState !== "collecting") return;
            if (rfElapsedSec() >= RF_CAPTURE_TARGET_SEC) completeRfCaptureSoon();
        }

        function calcHR(data, endTime) {
            if (!data.length || !Number.isFinite(endTime) || endTime < 10) return NaN;
            const windowData = data.filter(pt => pt[0] >= endTime - 10 && pt[0] <= endTime);
            if (windowData.length < 20) return NaN;
            let min = Infinity;
            let max = -Infinity;
            windowData.forEach(function(pt) {
                if (pt[1] < min) min = pt[1];
                if (pt[1] > max) max = pt[1];
            });
            const range = max - min;
            if (!Number.isFinite(range) || range <= 0) return NaN;
            const threshold = min + range * 0.72;
            const peaks = [];
            let lastPeak = -Infinity;
            for (let i = 1; i < windowData.length - 1; i++) {
                const prev = windowData[i - 1][1];
                const cur = windowData[i][1];
                const next = windowData[i + 1][1];
                const time = windowData[i][0];
                if (cur > threshold && cur > prev && cur >= next && time - lastPeak > 0.3) {
                    peaks.push(time);
                    lastPeak = time;
                }
            }
            if (peaks.length < 2) return NaN;
            const avg = (peaks[peaks.length - 1] - peaks[0]) / (peaks.length - 1);
            return avg > 0 ? Math.round(60 / avg) : NaN;
        }

        function calcGlucose(endTime) {
            if (!glucoseData.length || !Number.isFinite(endTime) || endTime < 60) return NaN;
            const avg = averageInWindow(glucoseData, Math.max(55, endTime - 5), endTime);
            if (!Number.isFinite(avg)) return NaN;
            return interpolate(glucoseCalibration, avg);
        }

        function calcTemperature() {
            if (!tempRtData.length) return NaN;
            const end = lastTime(tempRtData);
            const avg = averageInWindow(tempRtData, end - 10, end);
            if (!Number.isFinite(avg)) return NaN;
            return interpolate(temperatureCalibration, avg);
        }

        function calcCalciumStats(endTime) {
            if (!calciumData.length || !Number.isFinite(endTime) || endTime < 10) {
                return { potential: NaN, logCa: NaN, concentration: NaN };
            }
            const avgPotential = averageInWindow(calciumData, endTime - 10, endTime);
            if (!Number.isFinite(avgPotential)) {
                return { potential: NaN, logCa: NaN, concentration: NaN };
            }
            const logCa = interpolate(calciumCalibration, avgPotential);
            const concentration = Number.isFinite(logCa) ? Math.pow(10, logCa) : NaN;
            return {
                potential: avgPotential,
                logCa: logCa,
                concentration: concentration
            };
        }

        function formatCalcium(value) {
            if (!Number.isFinite(value)) return "--";
            if (value >= 10) return value.toFixed(1);
            if (value >= 1) return value.toFixed(2);
            if (value >= 0.01) return value.toFixed(3);
            return value.toExponential(2);
        }

        function averageInWindow(data, start, end) {
            let sum = 0;
            let count = 0;
            for (let i = 0; i < data.length; i++) {
                const t = data[i][0];
                if (t >= start && t <= end) {
                    sum += data[i][1];
                    count++;
                }
            }
            return count ? sum / count : NaN;
        }

        function interpolate(calibration, x) {
            if (!calibration || calibration.length < 2 || !Number.isFinite(x)) return NaN;
            const points = calibration.filter(pt => Number.isFinite(pt[0]) && Number.isFinite(pt[1])).sort((a, b) => a[0] - b[0]);
            if (points.length < 2) return NaN;
            if (x <= points[0][0]) return interpolateBetween(points[0], points[1], x);
            const last = points.length - 1;
            if (x >= points[last][0]) return interpolateBetween(points[last - 1], points[last], x);
            for (let i = 0; i < points.length - 1; i++) {
                if (x >= points[i][0] && x <= points[i + 1][0]) return interpolateBetween(points[i], points[i + 1], x);
            }
            return NaN;
        }

        function interpolateBetween(a, b, x) {
            const dx = b[0] - a[0];
            if (dx === 0) return a[1];
            return a[1] + (x - a[0]) * (b[1] - a[1]) / dx;
        }

        function lastTime(data) {
            return data.length ? data[data.length - 1][0] : NaN;
        }

        function shouldResampleRtOnExport() {
            const el = document.getElementById("resampleRtToEcg");
            return Boolean(el && el.checked && ecgData.length);
        }

        function resampleSeriesToTimes(data, targetTimes) {
            const points = data.filter(function(pt) {
                return pt && Number.isFinite(pt[0]) && Number.isFinite(pt[1]);
            });
            if (!points.length || !targetTimes.length) return [];
            if (points.length === 1) {
                return targetTimes.map(function(t) { return [t, points[0][1]]; });
            }

            let index = 0;
            const first = points[0];
            const last = points[points.length - 1];
            return targetTimes.map(function(t) {
                if (t <= first[0]) return [t, first[1]];
                if (t >= last[0]) return [t, last[1]];
                while (index + 1 < points.length && points[index + 1][0] < t) {
                    index++;
                }
                const a = points[index];
                const b = points[index + 1] || a;
                const dt = b[0] - a[0];
                if (dt <= 0) return [t, a[1]];
                return [t, a[1] + (t - a[0]) * (b[1] - a[1]) / dt];
            });
        }

        function metadataForSave(sessionId) {
            const fallbackTemp = calcTemperature();
            const temp = Number.isFinite(capturedTemperatureC) ? capturedTemperatureC : fallbackTemp;
            const capturedGlu = capturedGlucoseValue();
            const calciumStats = calcCalciumStats(lastTime(calciumData));
            const scheduleMeta = currentScheduleMeta();
            const modelId = personalModel ? (personalModelName || "model") : "NA";
            return {
                subject_id: sessionSubjectId(),
                session_id: sessionId,
                session_role: sessionRole(),
                captured_glucose_mmol_L: Number.isFinite(capturedGlu) ? capturedGlu.toFixed(2) : "NA",
                captured_temperature_C: Number.isFinite(temp) ? temp.toFixed(1) : "NA",
                prediction_glucose_mmol_L: Number.isFinite(rfPredictionValue) ? rfPredictionValue.toFixed(2) : "NA",
                calcium_concentration_mM: Number.isFinite(calciumStats.concentration) ? formatCalcium(calciumStats.concentration) : "NA",
                calcium_potential_avg_mV: Number.isFinite(calciumStats.potential) ? cell(calciumStats.potential) : "NA",
                scheduled_ep_task: scheduleMeta ? scheduleMeta.epTask : "NA",
                scheduled_ad5941_task: scheduleMeta ? scheduleMeta.adTask : "NA",
                ep_device_name: scheduleMeta ? scheduleMeta.epDeviceName : textValue("devName", "WeSys_EP2"),
                ad5941_device_name: scheduleMeta ? scheduleMeta.ad5941DeviceName : textValue("ad5941Name", "WeSys_5941"),
                scheduled_start_time: scheduleMeta ? scheduleMeta.startTime : "NA",
                scheduled_duration_s: scheduleMeta ? scheduleMeta.durationSec : "NA",
                model_id: modelId,
                capture_duration_s: captureDurationSec().toFixed(1)
            };
        }

        function metadataColumns(meta) {
            return [
                meta.subject_id,
                meta.session_id,
                meta.session_role,
                meta.captured_glucose_mmol_L,
                meta.captured_temperature_C,
                meta.prediction_glucose_mmol_L,
                meta.calcium_concentration_mM,
                meta.calcium_potential_avg_mV,
                meta.scheduled_ep_task,
                meta.scheduled_ad5941_task,
                meta.ep_device_name,
                meta.ad5941_device_name,
                meta.scheduled_start_time,
                meta.scheduled_duration_s,
                meta.model_id,
                meta.capture_duration_s
            ].map(metaCell);
        }

        function electroTimeHeader() {
            if (electroMode === "ECG") return "ECG_time_s";
            if (electroMode === "CALCIUM") return "Ca_time_s";
            return electroMode + "_time_s";
        }

        function electroValueHeader() {
            if (electroMode === "ECG") return "ECG_voltage_mV";
            if (electroMode === "CALCIUM") return "Ca_potential_mV";
            return electroMode + "_value_mV";
        }

        function metaCell(value) {
            return String(value == null || value === "" ? "NA" : value).replace(/[\t\r\n]/g, " ").trim() || "NA";
        }

        function saveAllData() {
            const rows = [];
            const sessionId = timestampName();
            const meta = metadataForSave(sessionId);
            rows.push(electroTimeHeader() + "\t" + electroValueHeader() + "\tIT_time_s\tIT_current_uA\tTemp_time_s\tTemp_resistance_ohm\tMovement_time_s\tMovement_resistance_ohm\tsubject_id\tsession_id\tsession_role\tcaptured_glucose_mmol_L\tcaptured_temperature_C\tprediction_glucose_mmol_L\tcalcium_concentration_mM\tcalcium_potential_avg_mV\tscheduled_ep_task\tscheduled_ad5941_task\tep_device_name\tad5941_device_name\tscheduled_start_time\tscheduled_duration_s\tmodel_id\tcapture_duration_s");
            const electroExport = getDataArray(electroMode);
            const resampleRt = shouldResampleRtOnExport() && electroMode === "ECG";
            const ecgTimes = resampleRt ? electroExport.map(function(pt) { return pt[0]; }).filter(Number.isFinite) : [];
            const tempExport = resampleRt ? resampleSeriesToTimes(tempRtData, ecgTimes) : tempRtData;
            const pulseExport = resampleRt ? resampleSeriesToTimes(pulseRtData, ecgTimes) : pulseRtData;
            const maxLen = Math.max(electroExport.length, glucoseData.length, tempExport.length, pulseExport.length);
            const metaValues = metadataColumns(meta);
            for (let i = 0; i < maxLen; i++) {
                const e = electroExport[i] || ["", ""];
                const g = glucoseData[i] || ["", ""];
                const t = tempExport[i] || ["", ""];
                const p = pulseExport[i] || ["", ""];
                rows.push([cell(e[0]), cell(e[1]), cell(g[0]), cell(g[1]), cell(t[0]), cell(t[1]), cell(p[0]), cell(p[1])].concat(metaValues).join("\t"));
            }
            const blob = new Blob([rows.join("\n")], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "wesys_v8_" + safeName(meta.subject_id) + "_" + meta.session_role + "_" + gluMode.toLowerCase() + "_" + sessionId + ".txt";
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showNotice(resampleRt ? "Data saved with resampled R-t" : "Data saved");
        }

        function timestampName() {
            const d = new Date();
            const pad = n => String(n).padStart(2, "0");
            return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
        }

        function safeName(value) {
            return String(value || "S01").replace(/[^A-Za-z0-9_-]+/g, "").slice(0, 24) || "S01";
        }

        function cell(value) {
            if (!Number.isFinite(value)) return "";
            if (Math.abs(value) >= 1000) return value.toFixed(3).replace(/\.?0+$/, "");
            return value.toFixed(6).replace(/\.?0+$/, "");
        }

        function showNotice(message) {
            const el = document.getElementById("notice");
            el.textContent = message;
            el.classList.add("show");
            clearTimeout(noticeTimer);
            noticeTimer = setTimeout(function() { el.classList.remove("show"); }, 1200);
        }

        function startRenderLoop() {
            if (renderRaf) return;
            const loop = function(now) {
                if (!lastRenderMs || now - lastRenderMs >= RENDER_INTERVAL_MS) {
                    lastRenderMs = now;
                    if (document.getElementById("pageRouting").classList.contains("active")) {
                        miniCharts.forEach(function(chart, index) {
                            if (!chart.frozen) chart.draw(rawDataBuffer[index] || []);
                        });
                    }
                    if (document.getElementById("pageDashboard").classList.contains("active")) {
                        Object.values(charts).forEach(chart => chart.draw());
                    }
                }
                renderRaf = requestAnimationFrame(loop);
            };
            renderRaf = requestAnimationFrame(loop);
        }

        class SignalChart {
            constructor(config) {
                this.canvas = document.getElementById(config.canvasId);
                this.ctx = this.canvas.getContext("2d");
                this.rangeEl = document.getElementById(config.rangeId);
                this.color = config.color;
                this.unit = config.unit;
                this.data = config.data || [];
                this.metricUpdate = config.metricUpdate;
                this.windowSize = VIEW_WINDOW;
                this.windowStart = 0;
                this.showAll = false;
                this.live = false;
                this.dragging = false;
                this.dragX = 0;
                this.dragStart = 0;
                this.width = 0;
                this.height = 0;
                this.bind();
                this.resize();
            }

            bind() {
                this.canvas.addEventListener("pointerdown", (event) => {
                    if (!this.data.length || this.showAll) return;
                    this.canvas.setPointerCapture(event.pointerId);
                    this.dragging = true;
                    this.live = false;
                    this.dragX = event.clientX;
                    this.dragStart = this.windowStart;
                });
                this.canvas.addEventListener("pointermove", (event) => {
                    if (!this.dragging) return;
                    const drawWidth = Math.max(1, this.width - 52 - 8);
                    const dx = event.clientX - this.dragX;
                    this.setWindowStart(this.dragStart - dx * this.windowSize / drawWidth);
                });
                this.canvas.addEventListener("pointerup", (event) => {
                    this.dragging = false;
                    try { this.canvas.releasePointerCapture(event.pointerId); } catch (err) {}
                    if (this.metricUpdate) this.metricUpdate();
                });
                this.canvas.addEventListener("pointercancel", () => { this.dragging = false; });
            }

            resize() {
                const rect = this.canvas.getBoundingClientRect();
                if (rect.width <= 0 || rect.height <= 0) return;
                const dpr = window.devicePixelRatio || 1;
                this.width = rect.width;
                this.height = rect.height;
                this.canvas.width = Math.max(1, Math.round(rect.width * dpr));
                this.canvas.height = Math.max(1, Math.round(rect.height * dpr));
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            setData(data) {
                this.data = data || [];
                this.windowStart = this.defaultStart();
                this.showAll = false;
                this.draw();
            }

            toggleShowAll() {
                this.showAll = !this.showAll;
                if (!this.showAll) this.windowStart = this.defaultStart();
                this.draw();
            }

            minTime() { return this.data.length ? this.data[0][0] : 0; }
            maxTime() { return this.data.length ? this.data[this.data.length - 1][0] : this.windowSize; }
            maxStart() { return Math.max(this.minTime(), this.maxTime() - this.windowSize); }
            defaultStart() { return this.clampStart(this.maxTime() - this.windowSize); }
            clampStart(v) { return Math.min(this.maxStart(), Math.max(this.minTime(), Number.isFinite(v) ? v : this.minTime())); }
            windowEnd() { return this.windowStart + this.windowSize; }
            metricEnd() { return this.showAll || this.live ? this.maxTime() : this.windowEnd(); }
            viewStart() { return this.showAll ? this.minTime() : this.windowStart; }
            viewEnd() { return this.showAll ? this.maxTime() : this.windowEnd(); }

            setWindowStart(value) {
                this.windowStart = this.clampStart(value);
                this.draw();
            }

            visibleData() {
                if (this.live && !this.showAll && !this.dragging) {
                    this.windowStart = this.defaultStart();
                }
                const start = this.viewStart();
                const end = this.viewEnd();
                const first = this.lowerBound(start);
                const visible = [];
                for (let i = first; i < this.data.length; i++) {
                    const t = this.data[i][0];
                    const y = this.data[i][1];
                    if (t >= start && t <= end && Number.isFinite(t) && Number.isFinite(y)) visible.push(this.data[i]);
                    else if (t > end) break;
                }
                return visible;
            }

            lowerBound(time) {
                let lo = 0;
                let hi = this.data.length;
                while (lo < hi) {
                    const mid = Math.floor((lo + hi) / 2);
                    if (this.data[mid][0] < time) lo = mid + 1;
                    else hi = mid;
                }
                return lo;
            }

            draw() {
                if (!this.width || !this.height) this.resize();
                if (!this.width || !this.height) return;
                const ctx = this.ctx;

                ctx.clearRect(0, 0, this.width, this.height);
                const visible = this.visibleData();
                const start = this.viewStart();
                const end = this.viewEnd();
                this.rangeEl.textContent = this.showAll ? "All" : start.toFixed(1) + "-" + end.toFixed(1) + " s";

                if (!visible.length) {
                    ctx.fillStyle = "#98a4b3";
                    ctx.font = "10px Arial, sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("No data", this.width / 2, this.height / 2);
                    return;
                }

                let minY = Infinity;
                let maxY = -Infinity;
                visible.forEach(function(pt) {
                    if (pt[1] < minY) minY = pt[1];
                    if (pt[1] > maxY) maxY = pt[1];
                });
                if (!Number.isFinite(minY) || !Number.isFinite(maxY)) {
                    ctx.fillStyle = "#98a4b3";
                    ctx.font = "10px Arial, sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("No valid data", this.width / 2, this.height / 2);
                    return;
                }
                if (this.unit === "mV" && baselineEnabled) {
                    if (electroMode === "EMG" || electroMode === "EEG") {
                        const absMax = Math.max(Math.abs(minY), Math.abs(maxY), 1);
                        minY = -absMax;
                        maxY = absMax;
                    } else {
                        minY = Math.min(minY, 0);
                        maxY = Math.max(maxY, 0);
                    }
                }
                let rangeY = maxY - minY;
                if (rangeY === 0) rangeY = Math.max(1, Math.abs(maxY) * 0.1);
                minY -= rangeY * 0.12;
                maxY += rangeY * 0.12;

                const yLabels = [];
                for (let i = 0; i <= 3; i++) {
                    const value = maxY - (maxY - minY) * i / 3;
                    yLabels.push(formatAxis(value, this.unit));
                }

                ctx.font = "9px Arial, sans-serif";
                const labelWidth = yLabels.reduce((max, label) => Math.max(max, ctx.measureText(label).width), 0);
                const padding = {
                    left: Math.min(110, Math.max(this.unit === "ohm" ? 70 : 46, Math.ceil(labelWidth + 12))),
                    right: 8,
                    top: 7,
                    bottom: 18
                };
                const drawW = Math.max(1, this.width - padding.left - padding.right);
                const drawH = Math.max(1, this.height - padding.top - padding.bottom);

                ctx.strokeStyle = "#e3e8ef";
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i <= 3; i++) {
                    const y = padding.top + drawH * i / 3;
                    ctx.moveTo(padding.left, y);
                    ctx.lineTo(this.width - padding.right, y);
                }
                ctx.stroke();

                ctx.fillStyle = "#6f7b8d";
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                for (let i = 0; i <= 3; i++) {
                    const y = padding.top + drawH * i / 3;
                    ctx.fillText(yLabels[i], padding.left - 5, y);
                }

                ctx.textAlign = "center";
                ctx.textBaseline = "top";
                ctx.fillText(start.toFixed(1) + " s", padding.left, this.height - padding.bottom + 5);
                ctx.fillText(end.toFixed(1) + " s", this.width - padding.right - 2, this.height - padding.bottom + 5);

                ctx.strokeStyle = this.color;
                ctx.lineWidth = 1.7;
                ctx.lineJoin = "round";
                ctx.lineCap = "round";
                ctx.beginPath();
                const timeRange = Math.max(0.001, end - start);
                let moved = false;
                const plotVisible = decimateForCanvas(visible, drawW);
                for (let i = 0; i < plotVisible.length; i++) {
                    const pt = plotVisible[i];
                    const x = padding.left + (pt[0] - start) / timeRange * drawW;
                    const y = padding.top + (maxY - pt[1]) / (maxY - minY) * drawH;
                    if (!moved) {
                        ctx.moveTo(x, y);
                        moved = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            }
        }

        class MiniChart {
            constructor(canvasId, color) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext("2d");
                this.color = color;
                this.frozen = false;
                this.width = 0;
                this.height = 0;
                this.resize();
            }

            resize() {
                const rect = this.canvas.getBoundingClientRect();
                if (rect.width <= 0 || rect.height <= 0) return;
                const dpr = window.devicePixelRatio || 1;
                this.width = rect.width;
                this.height = rect.height;
                this.canvas.width = Math.max(1, Math.round(rect.width * dpr));
                this.canvas.height = Math.max(1, Math.round(rect.height * dpr));
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            draw(data) {
                if (!this.width || !this.height) this.resize();
                if (!this.width || !this.height) return;
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.width, this.height);
                if (!data || !data.length) return;
                const end = data[data.length - 1][0];
                const start = Math.max(0, end - 5);
                const visible = visibleRecentPoints(data, 5);
                if (!visible.length) return;
                let minY = Infinity;
                let maxY = -Infinity;
                visible.forEach(function(pt) {
                    if (pt[1] < minY) minY = pt[1];
                    if (pt[1] > maxY) maxY = pt[1];
                });
                if (!Number.isFinite(minY) || !Number.isFinite(maxY)) return;
                let rangeY = maxY - minY;
                if (rangeY === 0) rangeY = 1;
                minY -= rangeY * 0.1;
                maxY += rangeY * 0.1;
                ctx.strokeStyle = "#edf1f5";
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 1; i <= 2; i++) {
                    const y = this.height * i / 3;
                    ctx.moveTo(0, y);
                    ctx.lineTo(this.width, y);
                }
                ctx.stroke();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 1.3;
                ctx.beginPath();
                let moved = false;
                const timeRange = Math.max(0.001, end - start);
                decimateForCanvas(visible, this.width).forEach((pt) => {
                    const x = (pt[0] - start) / timeRange * this.width;
                    const y = (maxY - pt[1]) / (maxY - minY) * this.height;
                    if (!moved) {
                        ctx.moveTo(x, y);
                        moved = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                ctx.stroke();
            }
        }

        function formatAxis(value, unit) {
            if (!Number.isFinite(value)) return "--" + (unit ? " " + unit : "");
            if (unit === "ohm") {
                const abs = Math.abs(value);
                if (abs >= 1e9) return (value / 1e9).toFixed(3).replace(/\.?0+$/, "") + " GΩ";
                if (abs >= 1e6) return (value / 1e6).toFixed(3).replace(/\.?0+$/, "") + " MΩ";
                if (abs >= 1e3) return (value / 1e3).toFixed(2).replace(/\.?0+$/, "") + " kΩ";
                return value.toFixed(abs >= 100 ? 1 : 2).replace(/\.?0+$/, "") + " Ω";
            }
            const abs = Math.abs(value);
            let text;
            if (abs >= 1000) text = value.toFixed(0);
            else if (abs >= 100) text = value.toFixed(1);
            else if (abs >= 10) text = value.toFixed(2);
            else text = value.toFixed(3);
            return text + (unit ? " " + unit : "");
        }

        class BaselineCorrector {
            constructor(mode) {
                this.mode = mode;
                this.preset = BASELINE_PRESETS[mode] || BASELINE_PRESETS.ECG;
                this.sampleRate = getElectroSamplingRate(mode);
                this.reset();
                this.alpha = 1 - Math.exp(-1 / Math.max(1, this.preset.tau * this.sampleRate));
                this.devAlpha = Math.min(0.05, this.alpha * 2);
            }

            reset() {
                this.baseline = 0;
                this.deviation = this.preset.minGuard;
                this.ready = false;
            }

            process(value) {
                if (!Number.isFinite(value)) return value;
                if (!this.ready) {
                    this.baseline = value;
                    this.deviation = this.preset.minGuard;
                    this.ready = true;
                    return 0;
                }
                const residual = value - this.baseline;
                const absResidual = Math.abs(residual);
                const guard = Math.max(this.preset.minGuard, this.deviation * this.preset.guard);
                const weight = absResidual <= guard ? 1 : this.preset.peakLeak;
                this.baseline += this.alpha * weight * residual;
                if (absResidual <= guard) {
                    this.deviation += this.devAlpha * (absResidual - this.deviation);
                }
                return value - this.baseline;
            }
        }

        class Biquad {
            constructor(type, freq, q, sampleRate) {
                this.type = type;
                this.freq = freq;
                this.q = q;
                this.sampleRate = sampleRate;
                this.reset();
                this.calc();
            }

            reset() {
                this.x1 = 0;
                this.x2 = 0;
                this.y1 = 0;
                this.y2 = 0;
                this.ready = false;
            }

            calc() {
                const w0 = 2 * Math.PI * this.freq / this.sampleRate;
                const alpha = Math.sin(w0) / (2 * this.q);
                const c = Math.cos(w0);
                let b0, b1, b2, a0, a1, a2;
                if (this.type === "lowpass") {
                    b0 = (1 - c) / 2; b1 = 1 - c; b2 = (1 - c) / 2;
                    a0 = 1 + alpha; a1 = -2 * c; a2 = 1 - alpha;
                } else if (this.type === "highpass") {
                    b0 = (1 + c) / 2; b1 = -(1 + c); b2 = (1 + c) / 2;
                    a0 = 1 + alpha; a1 = -2 * c; a2 = 1 - alpha;
                } else {
                    b0 = 1; b1 = -2 * c; b2 = 1;
                    a0 = 1 + alpha; a1 = -2 * c; a2 = 1 - alpha;
                }
                this.b0 = b0 / a0; this.b1 = b1 / a0; this.b2 = b2 / a0;
                this.a1 = a1 / a0; this.a2 = a2 / a0;
            }

            process(v) {
                if (!Number.isFinite(v)) {
                    this.reset();
                    return NaN;
                }
                if (!this.ready) {
                    this.x1 = v; this.x2 = v;
                    this.y1 = this.type === "highpass" ? 0 : v;
                    this.y2 = this.y1;
                    this.ready = true;
                }
                const y = this.b0 * v + this.b1 * this.x1 + this.b2 * this.x2 - this.a1 * this.y1 - this.a2 * this.y2;
                if (!Number.isFinite(y)) {
                    this.reset();
                    return NaN;
                }
                this.x2 = this.x1; this.x1 = v;
                this.y2 = this.y1; this.y1 = y;
                return y;
            }
        }

        class FilterChain {
            constructor(mode) {
                const sampleRate = getElectroSamplingRate(mode);
                const preset = FILTER_PRESETS[mode] || FILTER_PRESETS.ECG;
                this.filters = [];
                this.addFilter("notch", preset.notch, 30, sampleRate);
                this.addFilter("lowpass", preset.lp, 0.707, sampleRate);
                this.addFilter("highpass", preset.hp, 0.707, sampleRate);
            }

            addFilter(type, freq, q, sampleRate) {
                const safeFreq = clampFilterFreq(freq, sampleRate);
                if (!Number.isFinite(safeFreq) || safeFreq <= 0) return;
                this.filters.push(new Biquad(type, safeFreq, q, sampleRate));
            }

            process(value) {
                let v = value;
                for (let i = 0; i < this.filters.length; i++) {
                    v = this.filters[i].process(v);
                }
                return v;
            }

            reset() {
                this.filters.forEach(function(filter) {
                    filter.reset();
                });
            }
        }

        function clampFilterFreq(freq, sampleRate) {
            if (!Number.isFinite(freq) || !Number.isFinite(sampleRate) || sampleRate <= 0) return NaN;
            return Math.min(freq, sampleRate * 0.45);
        }

        handleChipChange();
        configureElectroMode();
    </script>
