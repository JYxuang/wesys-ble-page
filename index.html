<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>WeSys</title>
    <style>
        :root {
            --bg: #f7f9fb;
            --panel: #fff;
            --ink: #18212f;
            --muted: #687487;
            --line: #dce3ec;
            --blue: #2f7de1;
            --green: #11a379;
            --red: #d65353;
            --amber: #d98a14;
            --violet: #6f4de2;
            --shadow: 0 8px 24px rgba(24, 33, 47, 0.08);
        }

        * { box-sizing: border-box; }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: Arial, "Segoe UI", sans-serif;
            letter-spacing: 0;
            -webkit-text-size-adjust: 100%;
        }

        body { min-height: 100svh; }
        button, input, select { font: inherit; }

        .page {
            display: none;
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background: var(--bg);
        }

        .page.active { display: flex; }

        .setup-page {
            align-items: flex-start;
            justify-content: center;
            padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
            overflow-y: auto;
            background:
                linear-gradient(135deg, rgba(47, 125, 225, 0.08), rgba(17, 163, 121, 0.08)),
                var(--bg);
        }

        .panel {
            width: min(430px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 18px;
            margin: auto 0;
            max-height: calc(100svh - 36px);
            overflow-y: auto;
        }

        .panel h1 {
            margin: 0 0 16px;
            font-size: 22px;
            line-height: 1.15;
            font-weight: 800;
        }

        .field {
            display: grid;
            gap: 6px;
            margin-bottom: 12px;
        }

        .field label {
            font-size: 12px;
            line-height: 1;
            color: var(--muted);
            font-weight: 800;
            text-transform: uppercase;
        }

        .field input,
        .field select {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfcfe;
            color: var(--ink);
            outline: none;
        }

        .checkbox-field {
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 10px;
        }

        .checkbox-field input {
            width: 18px;
            height: 18px;
            padding: 0;
            margin: 0;
        }

        .checkbox-field label {
            text-transform: none;
            line-height: 1.25;
            color: var(--ink);
        }

        .primary-btn,
        .secondary-btn {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }

        .primary-btn { background: var(--blue); }
        .secondary-btn { background: var(--ink); }
        .danger-bg { background: var(--red) !important; }

        .status {
            min-height: 18px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
        }

        .routing-page {
            flex-direction: column;
            padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
        }

        .route-top {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 8px;
            align-items: center;
            min-height: 38px;
        }

        .back-btn,
        .icon-btn,
        .mini-icon,
        .chart-btn {
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            box-shadow: 0 2px 8px rgba(24, 33, 47, 0.05);
            cursor: pointer;
        }

        .back-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 800;
        }

        .route-title {
            min-width: 0;
            font-size: 16px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chip-pill {
            padding: 6px 9px;
            border-radius: 999px;
            background: rgba(17, 163, 121, 0.12);
            color: var(--green);
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .routing-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0;
            flex: 0 0 auto;
        }

        .routing-controls select,
        .routing-controls button {
            height: 38px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            font-size: 13px;
            font-weight: 800;
        }

        .routing-controls button {
            border: 0;
            background: var(--blue);
            color: #fff;
        }

        .mini-grid {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px;
            overflow-y: auto;
            padding-bottom: 6px;
        }

        .mini-grid.single {
            grid-template-columns: minmax(0, 1fr);
        }

        .mini-card {
            min-height: 112px;
            display: grid;
            grid-template-rows: 24px minmax(0, 1fr);
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 5px;
        }

        .mini-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
        }

        .mini-tools {
            display: flex;
            gap: 4px;
        }

        .mini-icon {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            color: var(--muted);
        }

        .mini-icon svg,
        .icon-btn svg,
        .chart-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
        }

        .mini-canvas {
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        .route-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex: 0 0 auto;
            margin-top: 6px;
        }

        .result-page {
            position: relative;
            flex-direction: column;
            padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
        }

        .topbar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
            min-height: 38px;
            flex: 0 0 auto;
        }

        .title {
            min-width: 0;
            font-size: 14px;
            line-height: 1.1;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .title-wrap {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .session-chip,
        .mini-pill,
        .mode-chip {
            display: inline-grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--panel);
            color: var(--muted);
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        .session-chip {
            height: 24px;
            max-width: 76px;
            padding: 0 8px;
            font-size: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-pill {
            height: 17px;
            min-width: 24px;
            padding: 0 5px;
            font-size: 9px;
            color: var(--green);
            border-color: rgba(17, 163, 121, 0.26);
            background: rgba(17, 163, 121, 0.08);
        }

        .session-panel {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            margin-top: 6px;
            padding: 6px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 4px 14px rgba(24, 33, 47, 0.06);
        }

        .schedule-panel {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            margin-top: 6px;
            padding: 6px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 4px 14px rgba(24, 33, 47, 0.06);
        }

        .session-field {
            display: grid;
            gap: 3px;
            min-width: 0;
        }

        .schedule-field {
            display: grid;
            gap: 3px;
            min-width: 0;
        }

        .session-field label,
        .schedule-field label {
            font-size: 8px;
            line-height: 1;
            color: var(--muted);
            font-weight: 800;
            text-transform: uppercase;
        }

        .session-field input,
        .session-field button,
        .schedule-field input,
        .schedule-field select,
        .schedule-field button,
        .schedule-status,
        .capture-display {
            width: 100%;
            height: 24px;
            min-width: 0;
            padding: 0 6px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fbfcfe;
            color: var(--ink);
            font-size: 10px;
            font-weight: 800;
            outline: none;
        }

        .session-field button,
        .schedule-field button {
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .schedule-field button.active {
            color: var(--green);
            border-color: rgba(17, 163, 121, 0.28);
            background: rgba(17, 163, 121, 0.08);
        }

        .schedule-duration {
            grid-column: span 2;
        }

        .schedule-plan {
            grid-column: span 2;
        }

        .duration-presets,
        .plan-presets,
        .duration-row {
            display: grid;
            gap: 4px;
            min-width: 0;
        }

        .duration-presets {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .plan-presets {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-column: 1 / -1;
        }

        .duration-row {
            grid-template-columns: minmax(0, 1fr) 54px;
        }

        .schedule-status-field {
            grid-column: span 2;
        }

        .schedule-status {
            display: flex;
            align-items: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
        }

        .schedule-status.active {
            color: var(--green);
            border-color: rgba(17, 163, 121, 0.28);
            background: rgba(17, 163, 121, 0.08);
        }

        .capture-display {
            display: flex;
            align-items: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
        }

        .capture-display.good {
            color: var(--green);
            border-color: rgba(17, 163, 121, 0.28);
            background: rgba(17, 163, 121, 0.08);
        }

        .capture-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 74px;
            gap: 4px;
            min-width: 0;
        }

        .session-field button.good {
            color: var(--green);
            border-color: rgba(17, 163, 121, 0.28);
            background: rgba(17, 163, 121, 0.08);
        }

        .toolbar {
            display: flex;
            gap: 5px;
        }

        .icon-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
        }

        .icon-btn.primary {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }

        .icon-btn.active {
            color: var(--green);
            border-color: rgba(17, 163, 121, 0.32);
            background: rgba(17, 163, 121, 0.10);
        }

        .icon-btn.warn { color: var(--amber); }

        .metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            flex: 0 0 auto;
            margin: 6px 0 7px;
        }

        .metric {
            min-width: 0;
            height: 46px;
            padding: 6px 8px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 2px 10px rgba(24, 33, 47, 0.04);
        }

        .metric-label {
            font-size: 10px;
            line-height: 1;
            color: var(--muted);
            font-weight: 800;
            text-transform: uppercase;
        }

        .metric-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .metric-value {
            margin-top: 4px;
            font-size: 16px;
            line-height: 1.05;
            font-weight: 800;
            white-space: nowrap;
        }

        .metric-unit {
            margin-left: 2px;
            font-size: 10px;
            font-weight: 800;
            color: var(--muted);
        }

        .chart-stack {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-rows: repeat(3, minmax(0, 1fr));
            gap: 6px;
        }

        .chart-block {
            min-height: 0;
            display: grid;
            grid-template-rows: 24px minmax(0, 1fr);
            padding: 5px 6px 4px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 2px 10px rgba(24, 33, 47, 0.04);
        }

        .chart-head {
            display: grid;
            grid-template-columns: minmax(64px, 1fr) auto auto;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .chart-name {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            line-height: 1;
            font-weight: 800;
        }

        .module-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }

        .module-chip {
            height: 20px;
            min-width: 26px;
            padding: 0 7px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--muted);
            font-size: 10px;
            line-height: 18px;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: none;
        }

        .module-chip.active {
            color: #fff;
        }

        .module-chip.module-blue.active {
            border-color: var(--blue);
            background: var(--blue);
        }

        .module-chip.module-amber.active {
            border-color: var(--amber);
            background: var(--amber);
        }

        .module-chip.module-green.active {
            border-color: var(--green);
            background: var(--green);
        }

        .module-chip.module-red.active {
            border-color: var(--red);
            background: var(--red);
        }

        .module-select {
            min-width: 58px;
            padding-right: 4px;
            outline: none;
        }

        .module-separator {
            color: var(--muted);
            font-size: 11px;
            line-height: 1;
            font-weight: 800;
        }

        .chart-mode-select {
            min-width: 58px;
            height: 20px;
            padding: 0 4px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: currentColor;
            font-size: 12px;
            line-height: 1;
            font-weight: 800;
            outline: none;
        }

        .swatch {
            width: 16px;
            height: 3px;
            border-radius: 999px;
            background: currentColor;
        }

        .chart-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .chart-btn {
            width: 22px;
            height: 22px;
            padding: 0;
            border-radius: 6px;
            color: var(--muted);
        }

        .chart-btn.playing {
            color: var(--amber);
            border-color: rgba(217, 138, 20, 0.32);
            background: rgba(217, 138, 20, 0.10);
        }

        .chart-btn.active {
            color: var(--green);
            border-color: rgba(17, 163, 121, 0.32);
            background: rgba(17, 163, 121, 0.10);
        }

        .chart-btn.danger { color: var(--red); }
        .chart-btn.switch { color: var(--blue); }
        .chart-btn .icon-pause { display: none; }
        .chart-btn.playing .icon-play { display: none; }
        .chart-btn.playing .icon-pause { display: block; }
        .chart-btn:disabled,
        .mode-chip:disabled,
        .module-chip:disabled {
            cursor: not-allowed;
            opacity: 0.42;
            box-shadow: none;
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .mode-chip {
            height: 18px;
            min-width: 24px;
            padding: 0 5px;
            font-size: 9px;
            line-height: 1;
        }

        .mode-chip.active {
            color: #fff;
            border-color: var(--green);
            background: var(--green);
        }

        .chart-block.disabled {
            background: #f4f7fa;
        }

        .chart-range {
            font-size: 9px;
            line-height: 1;
            color: var(--muted);
            white-space: nowrap;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 0;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .notice {
            position: absolute;
            left: 50%;
            top: max(8px, env(safe-area-inset-top));
            z-index: 5;
            transform: translate(-50%, -130%);
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(24, 33, 47, 0.92);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            opacity: 0;
            transition: transform 0.18s ease, opacity 0.18s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .notice.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        .hidden { display: none; }

        @media (max-height: 740px) {
            .result-page {
                padding-top: max(6px, env(safe-area-inset-top));
                padding-bottom: max(6px, env(safe-area-inset-bottom));
            }

            .topbar { min-height: 34px; }
            .title { font-size: 13px; }
            .session-panel {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .schedule-panel {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .schedule-duration,
            .schedule-plan,
            .schedule-status-field {
                grid-column: 1 / -1;
            }

            .plan-presets {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .icon-btn {
                width: 28px;
                height: 28px;
            }

            .metrics {
                margin: 4px 0 5px;
                gap: 5px;
            }

            .metric {
                height: 40px;
                padding: 5px 7px;
            }

            .metric-value {
                font-size: 14px;
                margin-top: 3px;
            }

            .chart-stack { gap: 5px; }

            .chart-block {
                grid-template-rows: 22px minmax(0, 1fr);
                padding: 4px 5px 3px;
            }

            .chart-name { font-size: 11px; }

            .chart-btn {
                width: 20px;
                height: 20px;
            }

            .chart-btn svg {
                width: 12px;
                height: 12px;
            }
        }
    </style>
</head>
<body>
    <section id="pageSetup" class="page setup-page active">
        <div class="panel">
            <h1>WeSys EP + AD5941</h1>

            <div class="field">
                <label for="chipConfig">ADS chip</label>
                <select id="chipConfig" onchange="handleChipChange()">
                    <option value="2">ADS1292 - 2 CH</option>
                    <option value="8">ADS1298 - 8 CH</option>
                </select>
            </div>

            <div class="field">
                <label for="ecgStreamMode">EP data stream</label>
                <select id="ecgStreamMode" onchange="handleEcgStreamModeChange()">
                    <option value="SINGLE" selected>Single channel stream</option>
                    <option value="INTERLEAVED">ADS channels interleaved - select CH on page 2</option>
                </select>
            </div>

            <div class="field">
                <label for="devName">Device name</label>
                <input id="devName" value="WeSys_EP2" autocomplete="off">
            </div>

            <button class="primary-btn" type="button" onclick="connectBluetooth()">Connect EP (Bluetooth)</button>
            <div id="setupStatus" class="status">Select chip and connect device.</div>

            <hr style="border: 0; border-top: 1px solid var(--line); margin: 16px 0;">

            <div class="field">
                <label for="ad5941Name">AD5941 device name</label>
                <input id="ad5941Name" value="WeSys_5941" autocomplete="off">
            </div>

            <button class="primary-btn" type="button" onclick="connectAd5941Bluetooth()" style="background: var(--green);">Connect AD5941 (Bluetooth)</button>
            <div id="ad5941Status" class="status">Set AD5941 BLE name to WeSys_5941.</div>

            <div class="field">
                <label for="recordDelay">Record delay after start (s)</label>
                <input id="recordDelay" value="3" inputmode="decimal">
            </div>

            <div class="field checkbox-field">
                <input id="resampleRtToEcg" type="checkbox">
                <label for="resampleRtToEcg">Resample AD5941 R-t to ECG 250 Hz on export</label>
            </div>

            <button class="secondary-btn" type="button" onclick="openRouting()" style="margin-top: 12px;">Open Monitor Setup</button>
        </div>
    </section>

    <section id="pageRouting" class="page routing-page">
        <div class="route-top">
            <button class="back-btn" type="button" onclick="backToSetup()">&lt;</button>
            <div class="route-title">Channel Routing</div>
            <div id="chipPill" class="chip-pill">ADS1292</div>
        </div>

        <div class="routing-controls">
            <button id="previewBtn" type="button" onclick="togglePreview()">Start Preview</button>
            <select id="electroModeSelect" onchange="handleElectroModeChange(this.value)">
                <option value="ECG">ECG 250Hz</option>
                <option value="CALCIUM">Calc 250Hz</option>
                <option value="EMG">EMG 1kHz</option>
                <option value="EEG">EEG 125Hz</option>
            </select>
            <select id="ecgChannelSelect"></select>
        </div>

        <div id="miniGrid" class="mini-grid"></div>

        <div class="route-bottom">
            <button class="secondary-btn" type="button" onclick="resetPreviewData()">Reset Preview</button>
            <button class="primary-btn" type="button" onclick="enterDashboard()">Open Monitor</button>
        </div>
    </section>

    <section id="pageDashboard" class="page result-page">
        <div id="notice" class="notice"></div>

        <div class="topbar">

            const el = document.getElementById("scheduleTimezone");
            if (!el) return "China UTC+8";
            const option = el.options[el.selectedIndex];
            if (!option) return selectedScheduleTimeZone();
            if (el.value === "local") return option.textContent + " (" + selectedScheduleTimeZone() + ")";
            return option.textContent;
        }

        function pad2(value) {
            return String(value).padStart(2, "0");
        }

        function zonedDateParts(ms, timeZone) {
            const formatter = new Intl.DateTimeFormat("en-US", {
                timeZone: timeZone,
                hourCycle: "h23",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
            const parts = {};
            formatter.formatToParts(new Date(ms)).forEach(function(part) {
                if (part.type !== "literal") parts[part.type] = part.value;
            });
            return {
                year: Number(parts.year),
                month: Number(parts.month),
                day: Number(parts.day),
                hour: Number(parts.hour),
                minute: Number(parts.minute),
                second: Number(parts.second)
            };
        }

        function timeZoneOffsetMs(timeZone, utcMs) {
            const parts = zonedDateParts(utcMs, timeZone);
            const zonedAsUtc = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
            return zonedAsUtc - utcMs;
        }

        function zonedDateTimeToEpochMs(dateText, timeText, timeZone) {
            const dateParts = String(dateText || "").split("-").map(Number);
            const timeParts = String(timeText || "").split(":").map(Number);
            if (dateParts.length < 3 || timeParts.length < 2) return NaN;
            const year = dateParts[0];
            const month = dateParts[1];
            const day = dateParts[2];
            const hour = timeParts[0];
            const minute = timeParts[1];
            const second = Number.isFinite(timeParts[2]) ? timeParts[2] : 0;
            if (![year, month, day, hour, minute, second].every(Number.isFinite)) return NaN;

            const wallAsUtc = Date.UTC(year, month - 1, day, hour, minute, second);
            let utcMs = wallAsUtc;
            for (let i = 0; i < 4; i++) {
                const offset = timeZoneOffsetMs(timeZone, utcMs);
                const nextUtcMs = wallAsUtc - offset;
                if (Math.abs(nextUtcMs - utcMs) < 1) return nextUtcMs;
                utcMs = nextUtcMs;
            }
            return utcMs;
        }

        function formatZonedDateTime(ms, timeZone) {
            if (!Number.isFinite(ms)) return "--";
            const parts = zonedDateParts(ms, timeZone);
            return parts.year + "-" + pad2(parts.month) + "-" + pad2(parts.day) + " " +
                pad2(parts.hour) + ":" + pad2(parts.minute) + ":" + pad2(parts.second);
        }

        function formatCountdown(ms) {
            const safeMs = Math.max(0, Math.ceil(ms));
            const totalSeconds = Math.floor(safeMs / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const deci = Math.floor((safeMs % 1000) / 100);
            if (minutes > 0) return minutes + ":" + pad2(seconds);
            return seconds + "." + deci + "s";
        }

        function initScheduleDefaults(force) {
            const dateEl = document.getElementById("scheduleDate");
            const timeEl = document.getElementById("scheduleTime");
            if (!dateEl || !timeEl) return;
            const timeZone = selectedScheduleTimeZone();
            const parts = zonedDateParts(Date.now() + 60000, timeZone);
            if (force || !dateEl.value) {
                dateEl.value = parts.year + "-" + pad2(parts.month) + "-" + pad2(parts.day);
            }
            if (force || !timeEl.value) {
                timeEl.value = pad2(parts.hour) + ":" + pad2(parts.minute) + ":" + pad2(parts.second);
            }
            scheduleDefaultsReady = true;
            updateDurationPresetUi();

        async function activateScheduledTask() {
            initScheduleDefaults(false);
            let startMs = readScheduleStartMs();
            const durationMs = readScheduleDurationMs();
            const plan = readSchedulePlan();
            const planError = validateSchedulePlan(plan, false);
            if (planError) {
                setScheduleStatus(planError, false);
                showNotice(planError);
                return;
            }
            await applyPlannedDashboardMode(plan);
            if (!Number.isFinite(startMs)) {
                setScheduleStatus("Invalid start", false);
                showNotice("Invalid start time");
                return;
            }
            if (!Number.isFinite(durationMs)) {
                setScheduleStatus("Invalid duration", false);
                showNotice("Invalid duration");
                return;
            }
            if (startMs < Date.now() - 250) {
                initScheduleDefaults(true);
                startMs = readScheduleStartMs();
            }
            const connectError = validateSchedulePlan(plan, true);
            if (connectError) {
                setScheduleStatus(connectError, false);
                showNotice(connectError);
                return;
            }

            cancelScheduledTask(false);
            setScheduleStatus("Arming " + schedulePlanLabel(plan), true);
            try {
                await prepareScheduledMeasurementPlan(plan);
            } catch (err) {
                setScheduleStatus("Arm failed", false);
                showNotice("Arm failed");
                console.error("[schedule] arm failed", err);
                return;
            }
            scheduledTask = {
                startMs: startMs,
                stopMs: startMs + durationMs,
                durationMs: durationMs,
                timeZone: selectedScheduleTimeZone(),
                plan: plan,
                state: "armed",
                started: false,
                stopping: false,
                intervalId: window.setInterval(runScheduledTaskTick, SCHEDULE_CHECK_INTERVAL_MS)
            };
            lastScheduleMeta = scheduleMetaFromTask(scheduledTask);
            updateScheduleButtonUi();
            runScheduledTaskTick();
            showNotice("Schedule armed");
        }

            lastScheduleMeta = scheduleMetaFromTask(scheduledTask);
            scheduledTask = null;

            updateDashboardModuleHighlights();

            if (!plan) return;
            if (!charts.ECG) initDashboardCharts();
            if (gluMode !== GLU_MODES.IT) {
                await setGluMode(GLU_MODES.IT, true);

            if (plan.epTask !== "NONE") {
                electroMode = plan.epTask;

                configureElectroMode();
                if (charts.ECG) charts.ECG.setData(getDataArray(plan.epTask));
            } else if (charts.ECG) {
                charts.ECG.setData([]);

                activeRtMode = plan.adTask;

        async function startPreparedScheduledTasks(task) {
            if (!task || !task.plan) return false;
            const plan = task.plan;
            const starts = [];
            resetSessionClock();
            if (plan.epTask !== "NONE") {
                starts.push(startBleTask(plan.epTask));
            }
            if (plan.adTask !== "NONE") {
                starts.push(startAd5941Task(plan.adTask));
            }
            if (!starts.length) return false;
            const results = await Promise.all(starts);
            return results.some(Boolean);
        }

        async function beginScheduledTask(task) {
            if (!task || task.state === "starting" || task.state === "running") return;
            task.started = true;
            task.state = "starting";
            setScheduleStatus("Starting " + schedulePlanLabel(task.plan), true);
            try {
                const ok = await startPreparedScheduledTasks(task);
                if (!scheduledTask || scheduledTask !== task) return;
                if (!ok) {
                    task.state = "error";
                    window.clearInterval(task.intervalId);
                    setScheduleStatus("Start failed", false);
                    updateScheduleButtonUi();
                    showNotice("Schedule start failed");
                    return;
                }
                task.state = "running";
                setScheduleStatus("Running " + formatCountdown(task.stopMs - Date.now()), true);
                showNotice("Scheduled recording started");
            } catch (err) {
                if (scheduledTask && scheduledTask === task) {
                    task.state = "error";
                    window.clearInterval(task.intervalId);
                    setScheduleStatus("Start failed", false);
                    updateScheduleButtonUi();
                }
                console.error("[schedule] start failed", err);
                showNotice("Schedule start failed");
            }
        }

        async function finishScheduledTask(task) {
            if (!task || task.stopping) return;
            task.stopping = true;
            task.state = "stopping";
            setScheduleStatus("Stopping", true);
            try {
                await stopAndSaveSession();
            } finally {
                if (scheduledTask && scheduledTask === task) {
                    window.clearInterval(task.intervalId);
                    const doneLabel = formatZonedDateTime(task.stopMs, task.timeZone).slice(11);
                    lastScheduleMeta = scheduleMetaFromTask(task);
                    scheduledTask = null;
                    setScheduleStatus("Completed " + doneLabel, false);
                    updateScheduleButtonUi();
                    showNotice("Scheduled recording stopped");
                }
            }
        }

        function runScheduledTaskTick() {
            if (!scheduledTask) return;
            const now = Date.now();
            if (!scheduledTask.started) {
                if (now >= scheduledTask.startMs) {
                    beginScheduledTask(scheduledTask);
                    return;
                }
                setScheduleStatus("Armed " + schedulePlanLabel(scheduledTask.plan) + " " + formatCountdown(scheduledTask.startMs - now), true);
                return;
            }

            if (scheduledTask.state === "starting") {
                setScheduleStatus("Starting " + schedulePlanLabel(scheduledTask.plan), true);
                return;
            }

            if (now >= scheduledTask.stopMs && !scheduledTask.stopping) {
                finishScheduledTask(scheduledTask);
                return;
            }
            setScheduleStatus("Running " + formatCountdown(scheduledTask.stopMs - now), true);
        }

        function predictGlucoseFromModel() {
            rfPredictionError = "";
            if (!personalModel) {
                rfPredictionError = "No Model";
                return NaN;
            }
            const keys = ["prediction_glucose_mmol_L", "fixed_prediction", "prediction", "glucose"];
            for (let i = 0; i < keys.length; i++) {
                const value = parseFloat(personalModel[keys[i]]);
                if (Number.isFinite(value)) return value;
            }
            const features = extractRfFeatures();
            if (!features) {
                rfPredictionError = "No Feature";
                return NaN;
            }
            const predicted = predictTreeEnsemble(personalModel, features);
            if (Number.isFinite(predicted)) return predicted;
            rfPredictionError = "Model invalid";
            return NaN;
        }

        function extractRfFeatures() {
            const ecg = recentWindow(ecgData, RF_CAPTURE_TARGET_SEC).filter(validPoint);
            const pulse = recentWindow(pulseRtData, RF_CAPTURE_TARGET_SEC).filter(validPoint);
            if (ecg.length < 80 || pulse.length < 40) return null;

            const ecgPeaks = detectBestPeaks(ecg, 0.35, 0.68);
            const pulsePeaks = detectBestPeaks(smoothPoints(pulse, 3), 0.45, 0.52);
            if (ecgPeaks.length < 4 || pulsePeaks.length < 4) return null;

            const pulseUnits = buildPulseUnits(pulse, pulsePeaks);
            if (pulseUnits.length < 3) return null;

            const rrMs = [];
            for (let i = 1; i < ecgPeaks.length; i++) {
                const rr = (ecgPeaks[i].t - ecgPeaks[i - 1].t) * 1000;
                if (rr > 300 && rr < 2000) rrMs.push(rr);
            }
            if (rrMs.length < 3) return null;

            const matched = [];
            for (let i = 0; i < ecgPeaks.length; i++) {
                const r = ecgPeaks[i];
                for (let j = 0; j < pulseUnits.length; j++) {
                    const u = pulseUnits[j];
                    if (u.onset.t <= r.t || u.peak.t <= u.onset.t || u.offset.t <= u.onset.t) continue;
                    const pttPeak = (u.peak.t - r.t) * 1000;
                    if (pttPeak > 100 && pttPeak < 700) {
                        matched.push({
                            r: r,
                            unit: u,
                            pttPeak: pttPeak,
                            pttOnset: (u.onset.t - r.t) * 1000,
                            rise: (u.peak.t - u.onset.t) * 1000,
                            fall: (u.offset.t - u.peak.t) * 1000
                        });
                        break;
                    }
                }
            }
            if (matched.length < 3) return null;

            const temp = Number.isFinite(capturedTemperatureC) ? capturedTemperatureC : calcTemperature();
            const fallbackTemp = modelDefaultFeature("temperature", 35.0);
            const now = new Date();
            const hour = now.getHours() + now.getMinutes() / 60;
            return {
                ecg_rr_mean: mean(rrMs),
                ecg_rr_std: std(rrMs),
                ecg_peak_mean: mean(matched.map(function(item) { return item.r.y; })),
                ecg_qrs_mean: mean(ecgPeaks.map(function(peak) { return estimatePeakWidthMs(ecg, peak); }).filter(Number.isFinite)),
                ptt_peak_mean: mean(matched.map(function(item) { return item.pttPeak; })),
                ptt_onset_mean: mean(matched.map(function(item) { return item.pttOnset; })),
                ppg_rise_time_mean: mean(matched.map(function(item) { return item.rise; })),
                ppg_fall_time_mean: mean(matched.map(function(item) { return item.fall; })),
                ppg_rise_ratio_mean: mean(matched.map(function(item) {
                    const total = item.rise + item.fall;
                    return total > 0 ? item.rise / total : NaN;
                }).filter(Number.isFinite)),
                temperature: Number.isFinite(temp) ? temp : fallbackTemp,
                hour_sin: Math.sin(2 * Math.PI * hour / 24),
                hour_cos: Math.cos(2 * Math.PI * hour / 24)
            };
        }

        function predictTreeEnsemble(model, features) {
            const trees = Array.isArray(model.trees) ? model.trees : [];
            const names = Array.isArray(model.feature_names) ? model.feature_names : [];
            if (!trees.length || !names.length) return NaN;
            const x = [];
            for (let i = 0; i < names.length; i++) {
                const name = names[i];
                let value = parseFloat(features[name]);
                if (!Number.isFinite(value)) value = modelDefaultFeature(name, NaN);
                if (!Number.isFinite(value)) return NaN;
                x.push(value);
            }
            let sum = 0;
            let count = 0;
            for (let i = 0; i < trees.length; i++) {
                const value = predictTree(trees[i], x);
                if (Number.isFinite(value)) {
                    sum += value;
                    count++;
                }
            }
            return count ? sum / count : NaN;
        }

        function predictTree(tree, x) {
            const left = tree.children_left || tree.left;
            const right = tree.children_right || tree.right;
            const feature = tree.feature;
            const threshold = tree.threshold;
            const value = tree.value;
            if (!left || !right || !feature || !threshold || !value) return NaN;
            let node = 0;
            for (let depth = 0; depth < 1000; depth++) {
                const f = feature[node];
                const l = left[node];
                const r = right[node];
                if (f < 0 || l < 0 || r < 0) return parseFloat(value[node]);
                node = x[f] <= threshold[node] ? l : r;
                if (node == null || node < 0 || node >= value.length) return NaN;
            }
            return NaN;
        }

        function modelDefaultFeature(name, fallback) {
            const defaults = personalModel && personalModel.default_features ? personalModel.default_features : {};
            const value = parseFloat(defaults[name]);
            return Number.isFinite(value) ? value : fallback;
        }

        function validPoint(pt) {
            return pt && Number.isFinite(pt[0]) && Number.isFinite(pt[1]);
        }

        function recentWindow(data, seconds) {
            const end = lastTime(data);
            if (!Number.isFinite(end)) return [];
            const start = Math.max(0, end - seconds);
            return data.filter(function(pt) {
                return validPoint(pt) && pt[0] >= start && pt[0] <= end;
            });
        }

        function smoothPoints(points, radius) {
            if (!points.length || radius <= 0) return points.slice();
            return points.map(function(pt, index) {
                let sum = 0;
                let count = 0;
                for (let i = Math.max(0, index - radius); i <= Math.min(points.length - 1, index + radius); i++) {
                    sum += points[i][1];
                    count++;
                }
                return [pt[0], count ? sum / count : pt[1]];
            });
        }

        function detectBestPeaks(points, minDistanceSec, thresholdRatio) {
            const positive = detectPeaks(points, minDistanceSec, thresholdRatio, 1);
            const negative = detectPeaks(points, minDistanceSec, thresholdRatio, -1);
            return negative.length > positive.length ? negative : positive;
        }

        function detectPeaks(points, minDistanceSec, thresholdRatio, polarity) {
            if (points.length < 3) return [];
            const ys = points.map(function(pt) { return polarity * pt[1]; });
            const min = Math.min.apply(null, ys);
            const max = Math.max.apply(null, ys);
            const range = max - min;
            if (!Number.isFinite(range) || range <= 0) return [];
            const threshold = min + range * thresholdRatio;
            const peaks = [];
            let lastT = -Infinity;
            for (let i = 1; i < points.length - 1; i++) {
                const y = ys[i];
                if (y < threshold || y < ys[i - 1] || y < ys[i + 1]) continue;
                const t = points[i][0];
                if (t - lastT < minDistanceSec) {
                    const last = peaks[peaks.length - 1];
                    if (last && y > last.y) {
                        peaks[peaks.length - 1] = { index: i, t: t, y: y, polarity: polarity };
                    }
                    continue;
                }
                peaks.push({ index: i, t: t, y: y, polarity: polarity });
                lastT = t;
            }
            return peaks;
        }

        function buildPulseUnits(points, peaks) {
            const units = [];
            for (let i = 0; i < peaks.length; i++) {
                const peak = peaks[i];
                const onset = findLocalExtreme(points, peak.t - 0.65, peak.t - 0.05, peak.polarity, "min");
                const nextOnset = i + 1 < peaks.length
                    ? findLocalExtreme(points, peaks[i + 1].t - 0.65, peaks[i + 1].t - 0.05, peak.polarity, "min")
                    : null;
                if (!onset || !nextOnset || nextOnset.t <= onset.t) continue;
                units.push({ onset: onset, peak: peak, offset: nextOnset });
            }
            return units;
        }

        function findLocalExtreme(points, start, end, polarity, kind) {
            let best = null;
            for (let i = 0; i < points.length; i++) {
                const t = points[i][0];
                if (t < start || t > end) continue;
                const y = polarity * points[i][1];
                if (!best || (kind === "min" ? y < best.y : y > best.y)) {
                    best = { index: i, t: t, y: y, polarity: polarity };
                }
            }
            return best;
        }

        function estimatePeakWidthMs(points, peak) {
            if (!peak || !Number.isFinite(peak.index)) return NaN;
            const center = peak.index;
            const polarity = peak.polarity || 1;
            const leftBound = Math.max(0, center - 30);
            const rightBound = Math.min(points.length - 1, center + 30);
            let base = Infinity;
            for (let i = leftBound; i <= rightBound; i++) {
                const y = polarity * points[i][1];
                if (y < base) base = y;
            }
            const half = base + (peak.y - base) * 0.5;
            let leftIndex = center;
            let rightIndex = center;
            while (leftIndex > leftBound && polarity * points[leftIndex][1] > half) leftIndex--;
            while (rightIndex < rightBound && polarity * points[rightIndex][1] > half) rightIndex++;
            const width = (points[rightIndex][0] - points[leftIndex][0]) * 1000;
            return width > 0 && width < 300 ? width : NaN;
        }

        function getElectroConfig(mode) {
            return ELECTRO_MODES[mode || electroMode] || ELECTRO_MODES.ECG;
        }

        function getElectroSamplingRate(mode) {
            return getElectroConfig(mode).samplingRate;
        }

        function getElectroTask(mode) {
            const key = mode || electroMode;
            return TASKS[key] || TASKS.ECG;
        }

        function getPreviewTask() {
            const task = getElectroTask(electroMode);
            return Object.assign({}, task);
        }

        function isElectroKind(kind) {
            return kind === "PREVIEW" || Boolean(ELECTRO_MODES[kind]);
        }

        function isMeasurementElectroKind(kind) {
            return kind !== "PREVIEW" && Boolean(ELECTRO_MODES[kind]);
        }

        function resolveElectroRequest(kind) {
            return kind === "ECG" ? electroMode : kind;
        }

        function getTaskConfig(kind) {
            if (kind === "PREVIEW") return getPreviewTask();
            if (isElectroKind(kind)) return getElectroTask(kind);
            return TASKS[kind];
        }

        function matchesTask(channelPid, taskPid, task) {
            return task && channelPid === task.channelPid && taskPid === task.taskPid;
        }

        function matchesElectroPacket(channelPid, taskPid, expectedTask) {
            if (!expectedTask || channelPid !== expectedTask.channelPid) return false;
            lastElectroTaskPid = taskPid;
            if (taskPid !== expectedTask.taskPid) {
                const key = electroMode + ":" + expectedTask.taskPid + ":" + taskPid;
                if (key !== lastElectroTaskPidNotice) {
                    console.warn("EP taskPid mismatch: expected 0x" + hexByte(expectedTask.taskPid) + ", received 0x" + hexByte(taskPid) + ". Packet ignored for " + electroMode + ".");
                    lastElectroTaskPidNotice = key;
                }
                return false;
            }
            return true;
        }

        function hexByte(value) {
            return (value & 0xff).toString(16).toUpperCase().padStart(2, "0");
        }

        function scaledElectroValue(rawValue) {
            // rawValue 现在已经是 V 单位（从 handleIncomingData 转换而来）
            // 需要转换为 mV：V × 1000 = mV
            const value = rawValue * 1000;
            if (!Number.isFinite(value) || Math.abs(value) > MAX_ELECTRO_ABS_MV) return NaN;
            return value;
        }

        function previewBufferLimit(rate) {
            const seconds = Math.max(PREVIEW_BUFFER_SECONDS, VIEW_WINDOW + 2);
            return Math.ceil(Math.max(1, rate) * seconds);
        }

        function trimPreviewBuffer(buffer, rate) {
            if (!buffer) return;
            const limit = previewBufferLimit(rate);
            if (buffer.length > limit) buffer.splice(0, buffer.length - limit);
        }

        function visibleRecentPoints(data, seconds) {
            if (!data || !data.length) return [];
            const end = data[data.length - 1][0];
            const start = Math.max(0, end - seconds);
            const visible = [];
            for (let i = data.length - 1; i >= 0; i--) {
                const pt = data[i];
                if (!pt || pt[0] < start) break;
                if (pt[0] <= end && Number.isFinite(pt[0]) && Number.isFinite(pt[1])) visible.push(pt);
            }
            visible.reverse();
            return visible;
        }

        function decimateForCanvas(points, width) {
            if (!points || points.length < 3 || !width || points.length <= width * 2) return points || [];
            const bucketSize = Math.max(1, Math.floor(points.length / Math.max(1, width)));
            const reduced = [];
            for (let i = 0; i < points.length; i += bucketSize) {
                let minPt = points[i];
                let maxPt = points[i];
                const end = Math.min(points.length, i + bucketSize);
                for (let j = i + 1; j < end; j++) {
                    if (points[j][1] < minPt[1]) minPt = points[j];
                    if (points[j][1] > maxPt[1]) maxPt = points[j];
                }
                if (minPt[0] <= maxPt[0]) {
                    reduced.push(minPt, maxPt);
                } else {
                    reduced.push(maxPt, minPt);
                }
            }
            return reduced;
        }

        async function connectBluetooth() {
            const status = document.getElementById("setupStatus");
            refreshEcgConfig();
            const deviceName = document.getElementById("devName").value.trim() || CHIP_DEFAULT_NAMES[totalChannels] || CHIP_DEFAULT_NAMES[2];
            status.textContent = "Connecting...";

            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: deviceName }],
                    optionalServices: [BLE_SERVICE_UUID]
                });
                bleDevice.addEventListener("gattserverdisconnected", handleEcgDisconnected);
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(BLE_SERVICE_UUID);
                bleWriteChar = await service.getCharacteristic(BLE_WRITE_UUID);
                bleReadChar = await service.getCharacteristic(BLE_READ_UUID);
                bleReadChar.addEventListener("characteristicvaluechanged", function(event) {
                    handleIncomingData(event, "ecg");
                });
                await bleReadChar.startNotifications();
                status.textContent = "EP connected";
                showNotice("EP connected");
            } catch (err) {
                console.error(err);
                status.textContent = "Connection failed: " + err.message;
            }
        }

        async function startHardwareTask(kind) {
            const task = getTaskConfig(kind);
            if (!task || !bleWriteChar) return false;
            const cmd = new Uint8Array([0, 0x0A, task.channelPid, task.taskPid]);
            console.log("[startHardwareTask] 启动任务:", kind, {
                channelPid: "0x" + task.channelPid.toString(16).padStart(2, '0'),
                taskPid: "0x" + task.taskPid.toString(16).padStart(2, '0'),
                command: Array.from(cmd).map(b => "0x" + b.toString(16).padStart(2, '0')).join(", ")
            });
            await writeBle(cmd);
            return true;
        }

        async function stopHardwareTask(kind) {
            const task = getTaskConfig(kind);
            if (!task || !bleWriteChar) return false;
            const cmd = new Uint8Array([0, 0x0B, task.channelPid, task.taskPid]);
            await writeBle(cmd);
            return true;
        }

        async function writeBle(bytes) {
            if (!bleWriteChar) return;
            if (typeof bleWriteChar.writeValueWithoutResponse === "function") {
                await bleWriteChar.writeValueWithoutResponse(bytes);
            } else {
                await bleWriteChar.writeValue(bytes);
            }
        }

        async function startAd5941HardwareTask(kind) {
            const task = TASKS[kind];
            if (!task || !ad5941WriteChar) return false;
            const cmd = new Uint8Array([0, 0x0A, task.channelPid, task.taskPid]);
            await writeAd5941Ble(cmd);
            return true;
        }

        async function stopAd5941HardwareTask(kind) {
            const task = TASKS[kind];
            if (!task || !ad5941WriteChar) return false;
            const cmd = new Uint8Array([0, 0x0B, task.channelPid, task.taskPid]);
            await writeAd5941Ble(cmd);
            return true;
        }

        async function writeAd5941Ble(bytes) {
            if (!ad5941WriteChar) return;
            if (typeof ad5941WriteChar.writeValueWithoutResponse === "function") {
                await ad5941WriteChar.writeValueWithoutResponse(bytes);
            } else {
                await ad5941WriteChar.writeValue(bytes);
            }
        }

        async function toggleTask(kind) {

                showNotice("GLU i-t disabled");

            if (kind === "PULSE" || kind === "TEMP" || kind === "GLU") {
                if (activeAd5941Task === kind) {
                    await stopAd5941Task(true);

                    clearTaskData(kind);
                    await startAd5941Task(kind);

        async function startSelectedTask() {
            dashboardModuleSelection = null;
            if (!charts.ECG) initDashboardCharts();
            const bgBeforeClear = capturedGlucoseValue();
            const tempBeforeClear = Number.isFinite(capturedTemperatureC) ? capturedTemperatureC : calcTemperature();
            await stopActiveTask(false);
            clearAllMeasurementData();
            if (Number.isFinite(bgBeforeClear) && !Number.isFinite(capturedGlucoseMmol)) {
                capturedGlucoseMmol = bgBeforeClear;
            }
            if (Number.isFinite(tempBeforeClear) && !Number.isFinite(capturedTemperatureC)) {
                capturedTemperatureC = tempBeforeClear;
            }
            updateCapturedGlucoseButton();
            updateCapturedTempButton();
            resetSessionClock();

            const starts = [];
            if (gluMode === GLU_MODES.RF) {
                if (electroMode !== "ECG") {
                    electroMode = "ECG";
                    configureElectroMode();
                }
                activeRtMode = "PULSE";
                applyRtMode();
                if (!bleWriteChar || !ad5941WriteChar) {
                    showNotice("Connect ECG + AD5941");
                    return;
                }
                startRfCaptureState();
                starts.push(startBleTask("ECG"));
                starts.push(startAd5941Task("PULSE"));

            await Promise.all(starts);

        async function startBleTask(kind) {
            if (!charts.ECG) initDashboardCharts();
            ensureSessionClock();
            if (activeTask && activeTask !== kind) {
                await stopBleTask(false);
            }

            console.log("[startBleTask] 启动任务:", kind, "electroMode:", electroMode);

            // 只在 EMG 模式下打印关键配置
            if (kind === "EMG") {
                const task = getTaskConfig(kind);
                console.log("⚙️ [EMG配置]", {
                    采样率: task ? task.samplingRate + " Hz" : "未定义",
                    缩放因子: ECG_SCALE,
                    流模式: ecgStreamMode,
                    通道数: totalChannels,
                    选中通道: selectedEcgChannel
                });
            }

            const ok = await startHardwareTask(kind);
            if (!ok) {
                showNotice("EP not connected");
                return false;
            }

            activeTask = kind;
            selectedTask = kind;
            appState = kind + "_RUNNING";

            // 更新图表数据引用
            if (isMeasurementElectroKind(kind)) {
                const currentData = getDataArray(kind);
                charts.ECG.data = currentData;
                charts.ECG.setData(currentData);
                charts.ECG.live = true;
                console.log("[startBleTask] 更新图表数据引用:", kind, "数据长度:", currentData.length);

                getChartForKind(kind).live = true;

            showNotice(taskLabel(kind) + " started");

            startRenderLoop();
            return true;

        async function startAd5941Task(kind) {
            if (!charts.ECG) initDashboardCharts();
            ensureSessionClock();
            if (!ad5941WriteChar) {
                showNotice("AD5941 not connected");
                return false;
            }
            if (activeAd5941Task && activeAd5941Task !== kind) {
                await stopAd5941Task(false);
            }

            try {
                const ok = await startAd5941HardwareTask(kind);
                if (!ok) {
                    showNotice("AD5941 not connected");
                    return false;
                }
                activeAd5941Task = kind;
                selectedTask = kind;
                if (!activeTask) appState = kind + "_RUNNING";
                getChartForKind(kind).live = true;
                updateUiState();
                startRenderLoop();
                showNotice(taskLabel(kind) + " started");
                return true;
            } catch (err) {
                const status = document.getElementById("ad5941Status");
                if (status) status.textContent = "AD5941 error: " + err.message;
                showNotice("AD5941 start failed");
                updateUiState();
                return false;
            }
